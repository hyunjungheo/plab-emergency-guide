<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AED 사용 가이드 — 진행 중 매치</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.css');
  html, body {
    margin:0; padding:0; height:100%; width:100%;
    background:#F0F2F5;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif;
    color:#111; -webkit-font-smoothing:antialiased;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family:inherit; -webkit-tap-highlight-color:transparent; }
  a { -webkit-tap-highlight-color:transparent; }

  /* ── 모바일: full-screen ─────────────────────────── */
  #root {
    width:100%; height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    overflow:hidden;
  }
  .frame-wrap {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    background:#fff; position:relative; overflow:hidden;
  }

  /* ── PC (≥ 640px): 폰 카드로 표시 ──────────────── */
  @media (min-width: 640px) {
    body { overflow:auto; }
    #root {
      height:100vh;
      padding:32px 24px;
      justify-content:flex-start; align-items:center;
      background:#F0F2F5;
      overflow:auto;
    }
    .frame-wrap {
      width:390px;
      /* 뷰포트에 꽉 차되 상하 32px 여백 확보 — 가독성 최적 */
      height: calc(100vh - 64px);
      min-height: 640px;
      max-height: 900px;
      border-radius:24px;
      overflow:hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
      flex:0 0 auto;
    }
    /* PC에서 모달은 카드 안에만 */
    .frame-wrap .modal-overlay {
      position:absolute !important;
    }
  }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  bgSurface:'#FFFFFF', bgSurfaceSecondary:'#F7F8FA',
  bgPrimary:'#1570FF', bgPrimarySoft:'#E8F1FF',
  textPrimary:'#1A1A1A', textSecondary:'#5E6470',
  textTertiary:'#9CA3AF', textBrand:'#1570FF',
  textError:'#FF4029', textOnPrimary:'#FFFFFF',
  borderDefault:'#E5E7EB', borderSubtle:'#EFF0F2',
  errorSoft:'#FFEAE8', errorLine:'#FFBFB8',
  rSm:8, rMd:12, rLg:16, rFull:9999,
};

/*
  ┌─────────────────────────────────────────────────────────────────────┐
  │  Button Style Map — 가이드 이미지 기준                               │
  │  각 상태: en(enabled) / hv(hovered+focused) / pr(pressed) / ds(disabled)│
  └─────────────────────────────────────────────────────────────────────┘

  primary    solid blue   높은 중요도
  tertiary   soft blue    중간 중요도
  quaternary soft gray    낮은 중요도 (비강조)
  negative   ghost red    낮은 중요도 (취소/경고)

  danger-solid   solid red  응급 강조 (119, CPR 타이머)
  danger-outline outline red 진행 중 보조 액션
*/
const STYLE_MAP = {
  primary: {
    en: { bg:'#1570FF', text:'#FFFFFF', border:'none' },
    hv: { bg:'#0F62E8', text:'#FFFFFF', border:'none' },
    pr: { bg:'#0A4EC4', text:'#FFFFFF', border:'none' },
    ds: { bg:'#C8D8FF', text:'rgba(255,255,255,0.55)', border:'none' },
  },
  tertiary: {
    en: { bg:'#E8F1FF', text:'#1570FF', border:'none' },
    hv: { bg:'#D4E5FF', text:'#1570FF', border:'none' },
    pr: { bg:'#AECBFF', text:'#0A4EC4', border:'none' },
    ds: { bg:'#F2F7FF', text:'#9BBDFF', border:'none' },
  },
  quaternary: {
    en: { bg:'#F2F3F5', text:'#3A3F47', border:'none' },
    hv: { bg:'#E5E7EA', text:'#3A3F47', border:'none' },
    pr: { bg:'#B8BDC7', text:'#1A1A1A', border:'none' },
    ds: { bg:'#EAEBEC', text:'#9CA3AF', border:'none' },
  },
  negative: {
    en: { bg:'transparent', text:'#FF4029', border:'none' },
    hv: { bg:'#FFF0EE',    text:'#FF4029', border:'none' },
    pr: { bg:'#FFD8D3',    text:'#E03520', border:'none' },
    ds: { bg:'transparent', text:'#FFBBAF', border:'none' },
  },
  'danger-solid': {
    en: { bg:'#FF4029', text:'#FFFFFF', border:'none' },
    hv: { bg:'#E03520', text:'#FFFFFF', border:'none' },
    pr: { bg:'#C42E1C', text:'#FFFFFF', border:'none' },
    ds: { bg:'#FFBFB8', text:'rgba(255,255,255,0.7)', border:'none' },
  },
  'danger-outline': {
    en: { bg:'transparent', text:'#FF4029', border:'1.5px solid #FF4029' },
    hv: { bg:'#FFF0EE',    text:'#FF4029', border:'1.5px solid #FF4029' },
    pr: { bg:'#FFD8D3',    text:'#E03520', border:'1.5px solid #E03520' },
    ds: { bg:'transparent', text:'#FFBBAF', border:'1.5px solid #FFBBAF' },
  },
};

function Button({ children, btnStyle='tertiary', size='lg', onClick, style, leftIcon, rightIcon, fullWidth, as, href, target, rel, ariaLabel, disabled }) {
  const [hov, setHov] = useState(false);
  const [prs, setPrs] = useState(false);
  const sz = {
    lg: { h:56, fs:17, fw:600, px:16, gap:8 },
    md: { h:48, fs:15, fw:600, px:14, gap:6 },
    sm: { h:36, fs:13, fw:600, px:12, gap:4 },
  }[size] || { h:56, fs:17, fw:600, px:16, gap:8 };

  const map = STYLE_MAP[btnStyle] || STYLE_MAP.tertiary;
  const st  = disabled ? map.ds : prs ? map.pr : hov ? map.hv : map.en;

  const evts = disabled ? {} : {
    // 마우스
    onMouseEnter:  () => setHov(true),
    onMouseLeave:  () => { setHov(false); setPrs(false); },
    onMouseDown:   () => setPrs(true),
    onMouseUp:     () => setPrs(false),
    // 터치 (모바일)
    onTouchStart:  () => setPrs(true),
    onTouchEnd:    () => { setPrs(false); setHov(false); },
    onTouchCancel: () => { setPrs(false); setHov(false); },
    // 포커스 (키보드 접근성)
    onFocus:       () => setHov(true),
    onBlur:        () => { setHov(false); setPrs(false); },
  };
  const base = {
    height: sz.h, padding: `0 ${sz.px}px`, borderRadius: C.rMd,
    background: st.bg, color: st.text, border: st.border,
    fontSize: sz.fs, fontWeight: sz.fw, letterSpacing: '-0.02em',
    cursor: disabled ? 'not-allowed' : 'pointer',
    width: fullWidth ? '100%' : 'auto',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: sz.gap,
    textDecoration: 'none',
    // transition: bg + border + color 모두 부드럽게
    transition: 'background .12s ease, border-color .12s ease, color .12s ease',
    // 브라우저 기본 탭 하이라이트 제거
    WebkitTapHighlightColor: 'transparent',
    outline: 'none',
    userSelect: 'none',
    ...style,
  };
  if (as === 'a' && href) return <a href={href} target={target} rel={rel} aria-label={ariaLabel} style={base} {...evts}>{leftIcon}{children}{rightIcon}</a>;
  return <button onClick={onClick} aria-label={ariaLabel} style={base} disabled={disabled} {...evts}>{leftIcon}{children}{rightIcon}</button>;
}

function IconButton({ children, onClick, ariaLabel }) {
  return (
    <button onClick={onClick} aria-label={ariaLabel} style={{
      width:40, height:40, borderRadius:C.rFull, border:'none',
      background:C.bgSurfaceSecondary, cursor:'pointer',
      display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0,
    }}>{children}</button>
  );
}

function BigTitle({ title, desc }) {
  return (
    <div style={{ padding:'8px 0 0' }}>
      <h1 style={{ margin:0, fontSize:26, lineHeight:1.25, letterSpacing:'-0.03em', fontWeight:800, color:C.textPrimary, whiteSpace:'pre-line' }}>{title}</h1>
      {desc && <div style={{ marginTop:10, fontSize:14, lineHeight:1.55, color:C.textSecondary, whiteSpace:'pre-line' }}>{desc}</div>}
    </div>
  );
}

/* ─── Flow ───────────────────────────────────────────────────── */
const FLOW = [
  { id:'intro',     kind:'intro',     title:'급성심정지가\n발생했다면', cta:'AED 사용법 자세히 보기' },
  { id:'locations', kind:'locations', title:'플랩 스타디움 AED 위치' },
  {
    id:'step1', kind:'step', n:1, label:'전원 켜기', art:'power',
    title:'자동심장충격기\n전원을 켜세요',
    instruct:'본체의 전원 버튼을 눌러주세요.',
    note:'덮개를 열면 자동으로 켜지는 기종도 있어요.',
    showRoles:true,
  },
  {
    id:'step2', kind:'step', n:2, label:'패드 부착', art:'pads',
    title:'패드 2개를\n가슴에 붙이세요',
    instruct:'그림 위치에 정확히 붙이세요.',
    noteBullets:['가슴에 물·땀이 있으면 닦고 붙여요.','붙이는 동안에도 심폐소생술은 멈추지 마세요.'],
    femaleNote:true,
  },
  {
    id:'step3', kind:'step', n:3, label:'리듬 분석', art:'analyze',
    title:'\u2018분석 중\u2019\n환자에게서 손을 떼세요',
    instruct:'자동심장충격기 음성 안내를 들으세요.',
    branches:[
      { go:'step4', voice:'충격이 필요합니다', sub:'충격 버튼 누르기', tone:'error' },
      { go:'step5', voice:'심폐소생술을 계속', sub:'가슴 압박 재개',   tone:'brand' },
    ],
  },
  {
    id:'step4', kind:'step', n:4, label:'전기 충격', art:'shock',
    title:'깜박이는 충격 버튼을\n누르세요',
    instruct:'한 번만 짧게 누르세요.',
    warn:'버튼 누르기 전, 모두 환자에게서 떨어졌는지 확인하세요.',
    shoutLine:'\u201c모두 떨어지세요!\u201d',
  },
  {
    id:'step5', kind:'step', n:5, label:'심폐소생술 재개', art:'cpr',
    title:'심폐소생술을\n다시 시작하세요',
    instruct:'가슴 가운데를 약 5cm 깊이로 누르세요.',
    cta:'가이드 닫기',
  },
];
const NEXT = { intro:'step1', step1:'step2', step2:'step3', step4:'step5' };
const findScreen = id => FLOW.find(s => s.id === id);

/* ─── Modal ──────────────────────────────────────────────────── */
function AEDModal({ onClose }) {
  const [id, setId]           = useState('intro');
  const [history, setHistory] = useState(['intro']);
  const goTo = next => { setHistory(h => [...h, next]); setId(next); };
  const back  = () => setHistory(h => {
    if (h.length <= 1) { onClose(); return h; }
    const nxt = h.slice(0, -1); setId(nxt[nxt.length - 1]); return nxt;
  });
  const advance = () => { const n = NEXT[id]; if (n) goTo(n); };
  const s = findScreen(id);
  const stepIds = ['step1','step2','step3','step4','step5'];
  const stepIdx = stepIds.indexOf(s.id);

  return (
    <div className="modal-overlay" style={{ position:'absolute', inset:0, zIndex:30, background:C.bgSurface, display:'flex', flexDirection:'column' }}>
      <header style={{ padding:'12px 20px 8px', flexShrink:0, background:C.bgSurface }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <IconButton ariaLabel="뒤로" onClick={back}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke={C.textPrimary} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </IconButton>
          <div style={{ flex:1, textAlign:'center' }}>
            {s.kind === 'step' ? (
              <>
                <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:6, marginBottom:4 }}>
                  {stepIds.map((sid, i) => (
                    <div key={sid} style={{ width:sid===s.id?20:8, height:4, borderRadius:C.rFull, background:i<=stepIdx?C.bgPrimary:'#DDE0E8', transition:'width .2s ease' }} />
                  ))}
                </div>
                <div style={{ fontSize:11, fontWeight:700, color:C.textSecondary, letterSpacing:'.08em' }}>STEP {s.n} / 5 · {s.label}</div>
              </>
            ) : s.kind === 'locations'
              ? <div style={{ fontSize:15, fontWeight:700, color:C.textPrimary }}>AED 위치 안내</div>
              : <div style={{ fontSize:15, fontWeight:700, color:C.textPrimary }}>응급상황 대응 가이드</div>
            }
          </div>
          <div style={{ width:40 }} />
        </div>
      </header>

      <main style={{ flex:1, overflow:'auto', background:C.bgSurface, padding:'0 20px 16px', display:'flex', flexDirection:'column' }}>
        {s.kind === 'intro'     && <IntroScreen     screen={s} onOpenLocations={() => goTo('locations')} onAdvance={advance} />}
        {s.kind === 'locations' && <LocationsScreen />}
        {s.kind === 'step'      && <StepScreen      screen={s} onPick={goTo} />}
      </main>

      <BottomAction screen={s} onAdvance={advance} onClose={onClose} goTo={goTo} />
    </div>
  );
}

/* ─── Intro ──────────────────────────────────────────────────── */
function IntroScreen({ screen, onOpenLocations, onAdvance }) {
  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column' }}>
      <BigTitle title={screen.title} desc="아래 3단계를 순서대로 진행하세요." />

      <div style={{ marginTop:18 }}>
        {[
          {
            n:'1', title:'119에 즉시 신고',
            /* ② 문구 수정 */
            body: <>반응·호흡이 없으면 <b style={{color:C.textPrimary}}>가장 먼저 119</b>에 신고하세요. 119 안내에 따라주세요.</>,
            action: (
              <div style={{marginTop:10}}>
                <Button as="a" href="tel:119" btnStyle="danger-solid" size="sm"
                  style={{borderRadius:C.rFull, height:36, padding:'0 14px'}}
                  leftIcon={<svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 4h3l2 5-2 1a11 11 0 0 0 6 6l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" fill="#fff"/></svg>}
                  rightIcon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              >119에 전화 걸기</Button>
              </div>
            ),
          },
          {
            n:'2', title:'심폐소생술 시작',
            body: <>가슴 가운데를 깊고 빠르게 누르세요. 인공호흡이 어려우면 <b style={{color:C.textPrimary}}>가슴압박만</b> 계속해도 돼요.</>,
            action: (
              <div style={{marginTop:10, display:'flex', alignItems:'baseline', gap:10, fontSize:13, color:C.textSecondary}}>
                {[['깊이','5cm'],['속도','100–120회/분'],['비율','30:2']].map(([l,v], i, a) => (
                  <span key={l} style={{display:'inline-flex', alignItems:'baseline', gap:4}}>
                    <span style={{fontSize:11.5, color:C.textTertiary, fontWeight:600}}>{l}</span>
                    <b style={{color:C.textPrimary, fontSize:14, letterSpacing:'-0.02em'}}>{v}</b>
                    {i < a.length-1 && <span style={{width:3, height:3, borderRadius:'50%', background:C.textTertiary, display:'inline-block', marginLeft:6}}/>}
                  </span>
                ))}
              </div>
            ),
          },
          {
            n:'3', title:'자동심장충격기(AED) 사용',
            body: <>전기 충격으로 멈춘 심장의 리듬을 되돌리는 응급 의료기기예요.</>,
            last: true,
          },
        ].map(({ n, title, body, action, last }) => (
          <div key={n} style={{ display:'flex', gap:14, paddingBottom:last?0:18, position:'relative' }}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', flexShrink:0, width:20 }}>
              <span style={{ fontSize:15, fontWeight:900, color:C.textError, lineHeight:1 }}>{n}</span>
              {!last && <div style={{ flex:1, width:1, marginTop:6, marginBottom:-10, background:C.borderSubtle }} />}
            </div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:16, fontWeight:800, color:C.textPrimary, letterSpacing:'-0.02em', lineHeight:1.3 }}>{title}</div>
              <div style={{ marginTop:6, fontSize:13.5, color:C.textSecondary, lineHeight:1.55 }}>{body}</div>
              {action}
            </div>
          </div>
        ))}
      </div>

      <button onClick={onOpenLocations} style={{ marginTop:12, width:'100%', cursor:'pointer', padding:'12px 4px', background:'transparent', border:'none', display:'flex', alignItems:'center', gap:6 }}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M12 22s7-7.5 7-12a7 7 0 1 0-14 0c0 4.5 7 12 7 12Z" stroke={C.textSecondary} strokeWidth="1.8"/>
          <circle cx="12" cy="10" r="2.4" stroke={C.textSecondary} strokeWidth="1.8"/>
        </svg>
        <span style={{ fontSize:13, fontWeight:600, color:C.textPrimary }}>플랩 스타디움 AED 비치 위치</span>
        <svg width="14" height="14" viewBox="0 0 24 24" style={{ marginLeft:'auto' }}><path d="M9 6l6 6-6 6" stroke={C.textTertiary} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/></svg>
      </button>

      {/* tertiary — 중간 중요도 */}
      <Button btnStyle="tertiary" size="lg" fullWidth onClick={onAdvance} style={{ marginTop:10 }}
        rightIcon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke={C.textBrand} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      >{screen.cta}</Button>

      <div style={{ marginTop:16, paddingTop:12, borderTop:`1px solid ${C.borderSubtle}`, textAlign:'center' }}>
        <a href="https://www.e-gen.or.kr/egen/first_aid_basics.do?contentsno=16" target="_blank" rel="noopener noreferrer"
          style={{ fontSize:11.5, color:C.textTertiary, textDecoration:'underline', textUnderlineOffset:3, display:'inline-flex', alignItems:'center', gap:4 }}>
          출처 · 중앙응급의료센터
        </a>
      </div>
      <div style={{ flex:1, minHeight:8 }} />
    </div>
  );
}

/* ─── Locations ──────────────────────────────────────────────── */
const STADIUM_AED = [
  { name:'플랩 스타디움 수원',                loc:'실내구장 화장실 및 자판기 옆' },
  { name:'플랩 스타디움 여주',                loc:'사무실 컨테이너 내부' },
  { name:'플랩 스타디움 가산 마리오',          loc:'엘리베이터 측 경기장 출입구 실내 공간' },
  { name:'플랩 스타디움 안산 고잔',            loc:'옥상층 출입문 앞 창고 내부' },
  { name:'플랩 스타디움 구미',                loc:'실내 사무 공간(장비 보관 장소) 앞' },
  { name:'플랩 스타디움 가산 디지털엠파이어',   loc:'1구장 측 옥상 계단 출입구 실내 공간' },
  { name:'플랩 스타디움 인천 남동',            loc:'경기장 옆 엘리베이터실 내부' },
  { name:'플랩 스타디움 가산 코오롱테크노밸리',  loc:'블랙구장 출입구 앞' },
];

function LocationsScreen() {
  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column' }}>
      <BigTitle title="플랩 스타디움 AED 위치" desc="매치 시작 전 미리 확인해 두면 도움이 돼요." />
      <div style={{ marginTop:16, borderRadius:C.rLg, background:C.bgSurfaceSecondary, overflow:'hidden' }}>
        {STADIUM_AED.map((s, i) => (
          <div key={s.name}>
            <div style={{ padding:'14px 16px', display:'flex', alignItems:'flex-start', gap:12 }}>

/* ─── Art Blocks ─────────────────────────────────────────────── */
function ArtBlock({ kind }) {
  return (
    <div style={{ display:'flex', justifyContent:'center', padding:'4px 0' }}>

      {kind === 'analyze' && <DeviceFigure highlight="analyze" />}

      {kind === 'cpr'     && <CPRFigure />}

}

function DeviceFigure({ highlight, pulse }) {

  return (

        <path d="M44 30c0-6 6-12 12-12h108c6 0 12 6 12 12v36H44Z" fill={lid} stroke={stroke} strokeWidth="1.5"/>
        <rect x="58" y="26" width="104" height="36" rx="3" fill={lidIn} stroke={stroke} strokeWidth="0.8"/>
        <path d="M30 64c0-6 6-12 12-12h136c6 0 12 6 12 12v82c0 6-6 12-12 12H42c-6 0-12-6-12-12Z" fill={body} stroke={stroke} strokeWidth="1.6"/>
        <rect x="44" y="68" width="78" height="34" rx="4" fill={disp} stroke={stroke} strokeWidth="0.8"/>
        <path d="M50 86h8l3-6 4 12 4-8h10" stroke={dim} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
        <g>{[0,1,2,3,4].map(i => <rect key={i} x={128+i*6} y={72} width="3" height="22" rx="1.5" fill={hiA?C.textError:dim}/>)}</g>
        {hiA && <Pulse cx={143} cy={83} r={26}/>}
        <circle cx="70" cy="128" r="20" fill={hiS?C.textError:'#E5E7EB'} stroke={hiS?C.textError:stroke} strokeWidth="1.6">
          {hiS && pulse && <animate attributeName="fill" values={`${C.textError};#FF7A69;${C.textError}`} dur="0.8s" repeatCount="indefinite"/>}
        </circle>
        <path d="M66 118l7 8-5 4 6 8-7-4" fill="none" stroke={hiS?'#fff':dark} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>

        <circle cx="139" cy="132" r="6" fill="none" stroke="#fff" strokeWidth="2"/>
        <path d="M139 126v6" stroke="#fff" strokeWidth="2" strokeLinecap="round"/>

function CPRFigure() {
  const DURATION=60, TOTAL=2;
  const [running, setRunning] = useState(false);
  const [set, setSet]         = useState(1);
  const [rem, setRem]         = useState(DURATION);
  const [done, setDone]       = useState(false);
  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setRem(p => {
      if (p > 1) return p - 1;
      if (set < TOTAL) { setSet(s => s + 1); return DURATION; }
      setRunning(false); setDone(true); return 0;
    }), 1000);
    return () => clearInterval(id);
  }, [running, set]);
  const start = () => { if (done) { setSet(1); setRem(DURATION); setDone(false); } setRunning(true); };
  const reset = () => { setRunning(false); setSet(1); setRem(DURATION); setDone(false); };
  const mm = String(Math.floor(rem/60)).padStart(1,'0');
  const ss = String(rem%60).padStart(2,'0');
  const R=70, CIRC=2*Math.PI*R, prog=(DURATION-rem)/DURATION;
  return (
    <div style={{ width:'100%' }}>
      <div style={{ padding:'18px 16px 16px', borderRadius:C.rLg, background:C.errorSoft, display:'flex', flexDirection:'column', alignItems:'center', gap:10 }}>

        {/* 세트 인디케이터 */}
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <div style={{ display:'flex', gap:5 }}>
            {Array.from({length:TOTAL}).map((_,i) => (
              <div key={i} style={{
                width: done||i<set ? 20 : 8,
                height: 6,
                borderRadius: C.rFull,
                background: done||i<set ? C.textError : 'rgba(255,64,41,.2)',
                transition: 'all .3s ease',
              }}/>
            ))}
          </div>
          <span style={{ fontSize:11.5, fontWeight:700, color:C.textError, letterSpacing:'.04em' }}>
            {done ? `${TOTAL}세트 완료` : `${set} / ${TOTAL}세트`}
          </span>
        </div>

        {/* 타이머 */}
        <div style={{ position:'relative', width:156, height:156 }}>
          <svg width="156" height="156" viewBox="0 0 168 168" style={{ transform:'rotate(-90deg)' }}>
            <circle cx="84" cy="84" r={R} stroke={C.bgSurface} strokeWidth="10" fill="none"/>
            <circle cx="84" cy="84" r={R} stroke={C.textError} strokeWidth="10" fill="none"
              strokeLinecap="round" strokeDasharray={CIRC} strokeDashoffset={CIRC*(1-prog)}
              style={{ transition:running?'stroke-dashoffset 1s linear':'none' }}/>
          </svg>
          <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:2 }}>
            <div style={{ fontSize:40, fontWeight:900, color:C.textError, letterSpacing:'-0.04em', lineHeight:1, fontVariantNumeric:'tabular-nums' }}>{mm}:{ss}</div>
            <div style={{ fontSize:11, color:C.textSecondary, fontWeight:600 }}>
              {done ? '완료' : running ? '진행 중' : '대기 중'}
            </div>
          </div>
        </div>

        {/* 수치 카드 */}
        <div style={{ width:'100%', display:'grid', gridTemplateColumns:'1fr 1fr 1.7fr', gap:6, textAlign:'center' }}>
          {[['압박:호흡','30 : 2'],['깊이','5cm'],['속도','100-120회/분']].map(([l,v]) => (
            <div key={l} style={{ padding:'8px 4px', borderRadius:C.rSm, background:C.bgSurface, display:'flex', flexDirection:'column', gap:2, alignItems:'center' }}>
              <span style={{ fontSize:10.5, color:C.textTertiary, fontWeight:600, whiteSpace:'nowrap' }}>{l}</span>
              <span style={{ fontSize:13, color:C.textPrimary, fontWeight:800, letterSpacing:'-0.02em', whiteSpace:'nowrap' }}>{v}</span>
            </div>
          ))}
        </div>

        {/* 타이머 버튼 — 채도 낮춘 레드 #E8624A */}
        <div style={{ display:'flex', gap:8, width:'100%' }}>
          {!running && !done && (
            <button onClick={start} style={{
              flex:1, height:48, borderRadius:C.rMd, border:'none', cursor:'pointer',
              background:C.bgSurface, color:C.textError,
              fontSize:15, fontWeight:700, letterSpacing:'-0.02em',
              display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8,
              transition:'background .14s ease', fontFamily:'inherit',
            }}
              onMouseEnter={e=>e.currentTarget.style.background='#FFF2F0'}
              onMouseLeave={e=>e.currentTarget.style.background=C.bgSurface}
              onTouchStart={e=>e.currentTarget.style.background='#FFE4E0'}
              onTouchEnd={e=>e.currentTarget.style.background=C.bgSurface}
            >
              타이머 시작
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke={C.textError} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
          )}
          {running && (
            <Button btnStyle="quaternary" size="md" fullWidth onClick={reset}
              leftIcon={<svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v6h6" stroke="#3A3F47" strokeWidth="2.2" strokeLinecap="round" fill="none"/></svg>}
              rightIcon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            >다시 시작</Button>
          )}
          {done && (
            <Button btnStyle="quaternary" size="md" fullWidth onClick={reset}
              leftIcon={<svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v6h6" stroke="#3A3F47" strokeWidth="2.2" strokeLinecap="round" fill="none"/></svg>}
              rightIcon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            >다시 시작</Button>
          )}
        </div>

      </div>
    </div>
  );
}

            </svg>
            <div>
              <div style={{ fontSize:12.5, fontWeight:800, color:C.textPrimary }}>119 도착까지 반복하세요</div>

              onTouchEnd={e=>e.currentTarget.style.color=C.textSecondary}
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
              가이드 닫기
            </button>
          </div>
        </>
      ) : (
        /* tertiary — 중간 중요도 */
        <Button btnStyle="tertiary" size="lg" fullWidth onClick={onAdvance}
          rightIcon={<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke={C.textBrand} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
        >{screen.cta || '다음'}</Button>
      )}
    </div>
  );
}
